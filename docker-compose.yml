services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"  # AMQP protocol port
      - "15672:15672"  # Management UI port
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: revoo
      POSTGRES_PASSWORD: Refaat2004
      POSTGRES_DB: outbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revoo -d outbox_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  adder-service:
    build:
      context: ./Adder_service
      dockerfile: Dockerfile
    container_name: adder-service
    environment:
      - DB_URL=postgresql://revoo:Refaat2004@postgres:5432/outbox_db
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "50051:50051"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app-network

  sink-service:
    build:
      context: ./Sink_service
      dockerfile: Dockerfile
    container_name: sink-service
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    ports:
      - "8080:8080"
    volumes:
      - ./Sink_service/saveFile:/app/saveFile
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data: 